<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الذكريات</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#18181b] text-gray-200 h-screen w-screen overflow-hidden select-none font-sans relative">

  <div id="menu" class="hidden absolute bg-[#27272a]/95 backdrop-blur-md border border-[#3f3f46] rounded-xl shadow-2xl w-48 z-50 p-1 text-xs text-gray-200">
    <button onclick="addCard()" class="w-full text-left px-3 py-1.5 hover:bg-[#3f3f46] rounded-lg flex justify-between items-center transition-colors">
      <span class="font-medium">New</span>
    </button>

    <div class="my-1 border-t border-[#3f3f46]/60"></div>

    <button onclick="copyCard()" class="w-full text-left px-3 py-1.5 hover:bg-[#3f3f46] rounded-lg flex justify-between items-center transition-colors">
      <span>Copy</span>
      <span class="text-[10px] text-gray-500 font-mono">copy</span>
    </button>
    <button onclick="pasteCard()" class="w-full text-left px-3 py-1.5 hover:bg-[#3f3f46] rounded-lg flex justify-between items-center transition-colors">
      <span>Paste</span>
      <span class="text-[10px] text-gray-500 font-mono">paste</span>
    </button>
    <button onclick="cutCard()" class="w-full text-left px-3 py-1.5 hover:bg-[#3f3f46] rounded-lg flex justify-between items-center transition-colors">
      <span>Cut</span>
      <span class="text-[10px] text-gray-500 font-mono">cut</span>
    </button>

    <div class="my-1 border-t border-[#3f3f46]/60"></div>

    <button onclick="deleteCard()" class="w-full text-left px-3 py-1.5 hover:bg-red-500/20 text-red-400 rounded-lg flex justify-between items-center transition-colors">
      <span class="font-medium">Delete</span>
      <span class="text-[10px] text-red-500/70 font-mono">Del</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
